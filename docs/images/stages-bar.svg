<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
  <title id="t">The Stages Bar</title>
  <desc id="d">Illustration of the Stages Bar: three cards named Work, Comms and Browse, each showing a small map of two displays with windows. The Work card is active and outlined in gold.</desc>
  <rect width="1000" height="330" rx="18" fill="#f4efe2"/>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
    <!-- card 1: Work (active) -->
    <rect x="40" y="36" width="280" height="196" rx="14" fill="#1a231e" stroke="#d9a441" stroke-width="4"/>
    <text x="58" y="66" font-size="19" font-weight="700" fill="#f4efe2">1  Work</text>
    <text x="302" y="66" font-size="13" text-anchor="end" fill="#d9a441">active</text>
    <rect x="56" y="82" width="156" height="104" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <rect x="62" y="88" width="68" height="92" rx="3" fill="#3b5a47"/><rect x="136" y="88" width="70" height="44" rx="3" fill="#3b5a47"/><rect x="136" y="136" width="70" height="44" rx="3" fill="#4d7a60"/>
    <rect x="220" y="94" width="84" height="92" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <rect x="226" y="100" width="72" height="80" rx="3" fill="#3b5a47"/>
    <text x="180" y="212" font-size="13" text-anchor="middle" fill="#8fa598">4 windows on 2 displays</text>
    <!-- card 2: Comms -->
    <rect x="360" y="36" width="280" height="196" rx="14" fill="#1a231e" stroke="#3b4d42" stroke-width="3"/>
    <text x="378" y="66" font-size="19" font-weight="700" fill="#f4efe2">2  Comms</text>
    <rect x="376" y="82" width="156" height="104" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <rect x="382" y="88" width="144" height="92" rx="3" fill="#2f4a3a"/>
    <rect x="540" y="94" width="84" height="92" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <rect x="546" y="100" width="72" height="38" rx="3" fill="#2f4a3a"/><rect x="546" y="142" width="72" height="38" rx="3" fill="#2f4a3a"/>
    <text x="500" y="212" font-size="13" text-anchor="middle" fill="#8fa598">3 windows on 2 displays</text>
    <!-- card 3: Browse -->
    <rect x="680" y="36" width="280" height="196" rx="14" fill="#1a231e" stroke="#3b4d42" stroke-width="3"/>
    <text x="698" y="66" font-size="19" font-weight="700" fill="#f4efe2">3  Browse</text>
    <rect x="696" y="82" width="156" height="104" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <rect x="702" y="88" width="70" height="92" rx="3" fill="#2f4a3a"/><rect x="778" y="88" width="68" height="92" rx="3" fill="#2f4a3a"/>
    <rect x="860" y="94" width="84" height="92" rx="6" fill="#0f1512" stroke="#3b4d42" stroke-width="2"/>
    <text x="820" y="212" font-size="13" text-anchor="middle" fill="#8fa598">2 windows on 1 display</text>
    <!-- caption -->
    <text x="500" y="276" font-size="19" font-weight="700" text-anchor="middle" fill="#1e2b24">⌃⌥1 to ⌃⌥9 switch Stages instantly</text>
    <text x="500" y="304" font-size="16" text-anchor="middle" fill="#4d5c53">Illustration: one Stage holds the windows of a task across every display. The other Stages wait off screen.</text>
  </g>
</svg>
