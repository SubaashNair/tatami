    <g stroke="#7fae8f" stroke-opacity="0.13" stroke-width="2"><line x1="0" y1="6" x2="1200" y2="6"/><line x1="0" y1="15" x2="1200" y2="15"/><line x1="0" y1="24" x2="1200" y2="24"/><line x1="0" y1="33" x2="1200" y2="33"/><line x1="0" y1="42" x2="1200" y2="42"/><line x1="0" y1="51" x2="1200" y2="51"/><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="69" x2="1200" y2="69"/><line x1="0" y1="78" x2="1200" y2="78"/><line x1="0" y1="87" x2="1200" y2="87"/><line x1="0" y1="96" x2="1200" y2="96"/><line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="114" x2="1200" y2="114"/><line x1="0" y1="123" x2="1200" y2="123"/><line x1="0" y1="132" x2="1200" y2="132"/><line x1="0" y1="141" x2="1200" y2="141"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="159" x2="1200" y2="159"/><line x1="0" y1="168" x2="1200" y2="168"/><line x1="0" y1="177" x2="1200" y2="177"/><line x1="0" y1="186" x2="1200" y2="186"/><line x1="0" y1="195" x2="1200" y2="195"/><line x1="0" y1="204" x2="1200" y2="204"/><line x1="0" y1="213" x2="1200" y2="213"/><line x1="0" y1="222" x2="1200" y2="222"/><line x1="0" y1="231" x2="1200" y2="231"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="249" x2="1200" y2="249"/><line x1="0" y1="258" x2="1200" y2="258"/><line x1="0" y1="267" x2="1200" y2="267"/><line x1="0" y1="276" x2="1200" y2="276"/><line x1="0" y1="285" x2="1200" y2="285"/><line x1="0" y1="294" x2="1200" y2="294"/><line x1="0" y1="303" x2="1200" y2="303"/><line x1="0" y1="312" x2="1200" y2="312"/></g>
    <rect y="306" width="1200" height="14" fill="#7fae8f"/>
