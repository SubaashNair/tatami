<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Tatami</title>
  <desc id="d">Banner: Tatami, a little room to focus. Keyboard first window management for macOS. Beside it the Tatami mark: a frame with two panes over one wide pane, the focused pane in gold.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8efde"/><stop offset="1" stop-color="#dde7d1"/></linearGradient>
  </defs>
  <g clip-path="url(#card)">
